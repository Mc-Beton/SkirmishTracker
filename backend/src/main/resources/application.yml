spring:
  application:
    name: skirmish-chronicle
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skirmish}
    username: ${DB_USER:skirmish}
    password: ${DB_PASSWORD:skirmish}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
  # Google/Discord login: set SPRING_PROFILES_ACTIVE=oauth plus the client IDs (see application-oauth.yml).

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:no-reply@skirmishchronicle.local}
  security:
    # HS256 key, at least 32 bytes. Always override in every non-local environment.
    jwt-secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-0123456789}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    email-token-ttl: 24h
    password-reset-ttl: 30m
    secure-cookies: ${SECURE_COOKIES:false}
    max-failed-logins: 5
    lockout-duration: 15m
    auth-rate-limit-per-minute: 20
