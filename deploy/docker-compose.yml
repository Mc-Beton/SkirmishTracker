# Production stack for warbracket.pl. Run on the server from /opt/warbracket/deploy:
#   docker compose up -d --build
# Only Caddy is reachable from the internet (80/443, automatic HTTPS). Backend and database stay on the
# internal network – the backend trusts X-Forwarded-For, so it must never be exposed directly.
name: warbracket

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: warbracket
      POSTGRES_USER: warbracket
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warbracket -d warbracket"]
      interval: 5s
      retries: 20
    networks: [internal]

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/warbracket
      DB_USER: warbracket
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      FRONTEND_URL: https://${DOMAIN:?set DOMAIN in deploy/.env}
      SECURE_COOKIES: "true"
      MAIL_HOST: ${MAIL_HOST:?set MAIL_HOST in deploy/.env}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@warbracket.pl}
      SUPPORT_INBOX: ${SUPPORT_INBOX:-}
      # Web Push: contact for push services; VAPID keys are generated once and kept in the database if empty.
      PUSH_SUBJECT: ${PUSH_SUBJECT:-mailto:admin@warbracket.pl}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      start_period: 60s
      retries: 10
    networks: [internal]

  frontend:
    build:
      context: ../frontend
      args:
        BACKEND_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [frontend]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  # Daily database dump kept for 14 days in the "backups" volume (see deploy/README.md for restore).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U warbracket -d warbracket -Fc -f /backups/warbracket-$$(date +%Y%m%d-%H%M).dump \
            && find /backups -name 'warbracket-*.dump' -mtime +14 -delete
          sleep 86400
        done
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
