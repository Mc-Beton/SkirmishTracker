# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skirmish
      POSTGRES_USER: skirmish
      POSTGRES_PASSWORD: skirmish
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skirmish -d skirmish"]
      interval: 5s
      retries: 10

  # Catches all outgoing e-mail (verification, password reset). Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
